name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: shellcheck
        run: shellcheck setup_aws.sh

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      us-node:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sharddb
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d sharddb"
          --health-interval 5s --health-timeout 3s --health-retries 10
      eu-node:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sharddb
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d sharddb"
          --health-interval 5s --health-timeout 3s --health-retries 10
      asia-node:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sharddb
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d sharddb"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ci-only-password
      GEOSHARD_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply schema to every shard
        env:
          PGPASSWORD: ci-only-password
        run: |
          for port in 5433 5434 5435; do
            psql -h localhost -p "$port" -U admin -d sharddb -v ON_ERROR_STOP=1 -q -f db/init_schema.sql
          done
      - run: pytest -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Build slim image
        run: docker build --build-arg INSTALL_RAG=false -t geoshard-api:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name api -p 8000:8000 -e RAG_EMBEDDING_BACKEND=hash geoshard-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/ && exit 0
            sleep 1
          done
          docker logs api
          exit 1
