[project]
name = "geosharddb"
version = "2.1.0"
description = "Multi-region distributed database simulator: geo-sharded PostgreSQL, Redis cache-aside, circuit-breaker failover, RAG and OS-concept demos"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S", "C90"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "S311",   # random is used for simulations, not cryptography
    "S608",   # SQL is built only from constant column/table names
    "RUF001", # allow unicode in docstrings
    "RUF002",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs live PostgreSQL shards (set GEOSHARD_INTEGRATION=1)",
]
filterwarnings = ["ignore::DeprecationWarning:faiss.*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["app.py", "core", "os_concepts", "rag", "benchmarks", "seed_data.py"]
