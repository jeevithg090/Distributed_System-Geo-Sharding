apiVersion: apps/v1
kind: Deployment

metadata:
  name: eu-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: eu-postgres

  template:

    metadata:
      labels:
        app: eu-postgres

    spec:

      containers:

      - name: postgres

        image: postgres:16

        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_USER
          value: admin

        - name: POSTGRES_PASSWORD
          value: password

        - name: POSTGRES_DB
          value: sharddb
---
apiVersion: v1
kind: Service

metadata:
  name: eu-postgres-service

spec:

  selector:
    app: eu-postgres

  ports:
    - port: 5432
      targetPort: 5432
