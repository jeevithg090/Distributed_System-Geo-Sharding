apiVersion: apps/v1
kind: Deployment

metadata:
  name: geoshard-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: geoshard-api

  template:

    metadata:
      labels:
        app: geoshard-api

    spec:

      containers:

      - name: api

        image: geoshard-api:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service

metadata:
  name: geoshard-api-service

spec:

  type: NodePort

  selector:
    app: geoshard-api

  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
