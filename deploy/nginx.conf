worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    upstream api_backend {
        # Docker's embedded DNS resolves "api" to every scaled replica at startup.
        server api:8000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            # Retry on another replica only when one is unreachable. Application
            # 503s (e.g. a shard is down) must not mark healthy replicas as failed.
            proxy_next_upstream error timeout;
        }
    }
}
